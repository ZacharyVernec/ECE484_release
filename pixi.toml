[workspace]
channels = ["conda-forge"]
name = "ECE484-assignment2"
platforms = ["linux-64"]
version = "1.0.0"

[tasks]
# Format code using black (auto-format Python files)
format = "black src || true"
# Lint code using ruff (check for code style issues)
lint = "ruff check src || true"

[dependencies]
python = ">=3.11,<3.12"

[pypi-dependencies]
pennylane = ">=0.43.2, <0.44"
qiskit-aer = ">=0.17.2, <0.18"
qiskit = ">=2.3.0, <3"
qiskit-ibm-runtime = ">=0.45.0, <0.46"
numpy = ">=2.4.1, <3"
pytest = ">=9.0.2, <10"
black = ">=25.12.0, <26"
ruff = ">=0.14.11, <0.15"
pyyaml = ">=6.0.3, <7"
pytest-xdist = ">=3.8.0, <4"
qutip = ">=5.2.2, <6"
qpic = ">=1.1.0, <2"
